notes: >-
  Appfire ships its apps through the Atlassian Marketplace rather than as language SDKs, so there is no
  general-purpose Appfire API client library on npm/PyPI/Maven. What is published first-party is (a) the
  7pace worklog import CLI, and (b) the @appfire-ux scope, which carries Appfire's internal design-system
  and AI-agent tooling for teams building Appfire apps. No first-party client library was found for the
  7pace Timetracker REST API, the OKR API, or the BigPicture public API on any registry probed
  (npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, crates.io).
