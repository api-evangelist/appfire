      tags:
      - Settings
  /api/v2/settings/customFields/settings:
    servers:
    - url: /
      description: Production API
    post:
      summary: Create a custom fields setting
      description: Creates a custom fields setting bound to one or more spaces (Jira project ids).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomFieldSettingRequest'
      responses:
        '200':
          description: Setting created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldSetting'
        '400':
          description: Validation error. CUSTOM_FIELDS_SETTING_CONFLICT is returned when the name is already in use or a space is already bound to another setting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        '403':
          description: Forbidden. The user associated with the apitoken does not have permission to manage settings.
        '500':
          description: Internal server error.
      tags:
      - Settings
  /api/v2/settings/customFields/settings/{settingId}:
    servers:
    - url: /
      description: Production API
    put:
      summary: Update a custom fields setting
      description: Updates a setting name and/or its bound spaces. At least one of name or spaceIds must be provided.
      parameters:
      - in: path
        name: settingId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomFieldSettingRequest'
      responses:
        '200':
          description: Setting updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldSetting'
        '400':
          description: Validation error. CUSTOM_FIELDS_SETTING_NOT_FOUND when the setting does not exist; CUSTOM_FIELDS_SETTING_CONFLICT on name or space uniqueness violations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        '403':
          description: Forbidden. The user associated with the apitoken does not have permission to manage settings.
        '500':
          description: Internal server error.
      tags:
      - Settings
    delete:
      summary: Delete a custom fields setting
      description: Deletes a custom fields setting by id. Idempotent.
      parameters:
      - in: path
        name: settingId
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Setting deleted successfully, or it did not exist prior to the request.
        '401':
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        '403':
          description: Forbidden. The user associated with the apitoken does not have permission to manage settings.
        '500':
          description: Internal server error.
      tags:
      - Settings
components:
  schemas:
    JiraNotificationsSettingsRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    CreateDropdownOptionRequest:
      type: object
      required:
      - value
      - color
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          pattern: ^#([0-9a-fA-F]{6})$
    CreateCustomFieldSettingRequest:
      type: object
      required:
      - name
      - spaceIds
      properties:
        name:
          type: string
          minLength: 1
        spaceIds:
          type: array
          items:
            type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        traceId:
          type: string
    CreateToggleCustomFieldRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        enabled:
          type: boolean
        mandatory:
          type: boolean
        description:
          type: string
          maxLength: 150
        default:
          type: boolean
    UpdateDropdownCustomFieldRequest:
      type: object
      required:
      - name
      - options
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        enabled:
          type: boolean
        mandatory:
          type: boolean
        description:
          type: string
          maxLength: 150
        options:
          type: array
          minItems: 1
          maxItems: 199
          items:
            $ref: '#/components/schemas/UpdateDropdownOptionRequest'
    ToggleSettings:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        mandatory:
          type: boolean
        description:
          type: string
        default:
          type: boolean
    CreateDropdownCustomFieldRequest:
      type: object
      required:
      - name
      - options
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        enabled:
          type: boolean
        mandatory:
          type: boolean
        description:
          type: string
          maxLength: 150
        options:
          type: array
          minItems: 1
          maxItems: 199
          items:
            $ref: '#/components/schemas/CreateDropdownOptionRequest'
    DropdownOptionSettings:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        color:
          type: string
        used:
          type: integer
    DropdownSettings:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        mandatory:
          type: boolean
        description:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/DropdownOptionSettings'
    UpdateCustomFieldSettingRequest:
      type: object
      description: At least one of name or spaceIds must be provided.
      properties:
        name:
          type: string
          minLength: 1
        spaceIds:
          type: array
          items:
            type: string
    UpdateToggleCustomFieldRequest:
      allOf:
      - $ref: '#/components/schemas/CreateToggleCustomFieldRequest'
    JiraNotificationsSettingsResponse:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    AccountSettings:
      type: object
      properties:
        dropdown:
          type: array
          items:
            $ref: '#/components/schemas/DropdownSettings'
        toggle:
          type: array
          items:
            $ref: '#/components/schemas/ToggleSettings'
    CustomFieldSetting:
      type: object
