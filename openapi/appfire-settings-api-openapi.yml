                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        '500':
          description: Internal server error.
      tags:
      - Settings
  /api/v2/settings/customFields/dropdown/{customFieldId}:
    servers:
    - url: /
      description: Production API
    put:
      summary: Update a dropdown custom field
