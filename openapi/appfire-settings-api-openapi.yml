      parameters:
      - in: path
        name: customFieldId
        required: true
        schema:
          type: string
      - in: query
        name: settingId
        required: false
        description: Setting id the custom field belongs to. Omit for global.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDropdownCustomFieldRequest'
      responses:
