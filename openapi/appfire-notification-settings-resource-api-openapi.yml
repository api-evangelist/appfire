      properties:
        cadenceType:
          type: string
          enum:
          - WEEK
          - TWO_WEEKS
          - MONTH
        dayOfWeek:
          type: integer
          format: int32
        dayOfMonth:
          type: string
          enum:
          - FIRST_DAY
          - LAST_DAY
        hour:
          type: integer
          format: int32
      required:
      - cadenceType
      - dayOfMonth
      - dayOfWeek
      - hour
    NotificationInfoBean:
      type: object
      properties:
        dateOfLastSync:
          type: string
          format: date-time
        dateOfNextSync:
          type: string
          format: date-time
      required:
      - dateOfNextSync
    NotificationSettingsBean:
      type: object
      properties:
        sendUpdateReminderEmail:
          $ref: '#/components/schemas/NotificationSettingBean'
      required:
      - sendUpdateReminderEmail
    UserNotificationSettingsBean:
      type: object
      properties:
        enabled:
          type: boolean
        newCommentOnUserOwnedOkr:
          type: boolean
        newCommentOnUserOwnedUpdate:
          type: boolean
        newCommentReplyOnUserOwnedComment:
          type: boolean
        newMentionOnAnyComment:
          type: boolean
        assignedToOkr:
          type: boolean
      required:
      - assignedToOkr
      - enabled
      - newCommentOnUserOwnedOkr
      - newCommentOnUserOwnedUpdate
      - newCommentReplyOnUserOwnedComment
      - newMentionOnAnyComment
