components:
  schemas:
    NotificationInformationBean:
      type: object
      properties:
        sendUpdateReminderEmail:
          $ref: '#/components/schemas/NotificationInfoBean'
      required:
      - sendUpdateReminderEmail
    NotificationSettingsWithInfoBean:
      type: object
      properties:
        settings:
