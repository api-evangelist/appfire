components:
  schemas:
    ApiExportKeyResult:
      type: object
      description: A key result linked to an objective
      properties:
        id:
          type: string
          description: Unique identifier
          examples:
          - 62384a6942adda046598b3bd
        key:
          type: string
          description: Human-readable key
          examples:
          - KR-108
        name:
          type: string
          description: Key result title
          examples:
          - Close 15 enterprise deals
        link:
          type: string
          description: Deep link to the key result in OKR for Jira
        description:
          type: string
          description: Rich-text description
        parentObjectiveId:
          type: string
          description: ID of the parent objective
          examples:
          - 62334eac00ee2b102e34fdb7
        issueIds:
          type: array
          description: IDs of linked Jira issues
          items:
            type: string
        typeId:
          type: string
          description: OKR type ID, when types are enabled
        typeName:
          type: string
          description: OKR type name, when types are enabled
        ownerAccountId:
          type: string
          description: Jira account ID of the owner
          examples:
          - 557058:5aedf933-2312-40bc-b328-0c21314167f0
        collaboratorAccountIds:
          type: array
          description: Jira account IDs of collaborators
          items:
            type: string
        percentDone:
          type: number
          format: double
          description: Progress percentage (0-100)
          examples:
          - 45.0
        created:
          type: string
          format: date-time
          description: Creation timestamp
          examples:
          - 2024-01-15T10:30:00+0000
        startDate:
          type: string
          format: date-time
          description: Start date
          examples:
          - 2024-01-01T00:00:00+0000
        deadline:
          type: string
          format: date-time
          description: Due date
          examples:
          - 2024-03-31T23:59:59+0000
        expectedEndDate:
          type: string
          format: date-time
          description: Expected end date
          examples:
          - 2024-03-31T23:59:59+0000
        labelIds:
          type: array
          description: IDs of associated labels
          items:
            type: string
        teamIds:
          type: array
          description: Team identifiers linked to this key result. Match **teams[].id** when **TEAMS** is expanded. For more team fields, use the **Teams** API documented in the BigPicture developer documentation.
          items:
            type: string
        periodAliasId:
          type: string
          description: ID of the period this key result belongs to
        latestUpdate:
          $ref: '#/components/schemas/ApiExportUpdate'
        unit:
          $ref: '#/components/schemas/ApiExportUnit'
        currentProgressDefinition:
          $ref: '#/components/schemas/ApiExportProgressDefinition'
        weight:
          type: integer
          format: int32
          description: Weight for weighted progress calculation
          examples:
          - 1
        finalGrade:
          type: number
          format: double
          description: Final grade when key result is closed
          examples:
          - 0.9
        customFields:
          type: object
          additionalProperties: {}
          description: Custom field values keyed by field ID. Only includes fields that are visible (not hidden or deleted). Expand CUSTOM_FIELDS to receive field definitions (id, name, type, etc.) as a lookup.
    ApiExportUpdate:
      type: object
      description: A status update for an objective or key result
      properties:
        updateId:
          type: string
          description: Unique update identifier
          examples:
          - 6456a3b200ee2b102e34fdb9
        entityId:
          type: string
          description: ID of the objective or key result this update belongs to
          examples:
          - 62334eac00ee2b102e34fdb7
        status:
          type: string
          description: Status enum value
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
          examples:
          - ON_TRACK
        displayedStatus:
          type: string
          description: Human-readable status label
          examples:
          - On Track
        created:
          type: string
          format: date-time
          description: When the update was created
          examples:
          - 2024-02-15T14:30:00+0000
        value:
          type: number
          format: double
          description: Current progress value (key results only)
          examples:
          - 13500.5
        description:
          type: string
          description: Update description/comment text
        startValue:
          type: number
          format: double
          description: Start value of the progress range
          examples:
          - 0.0
        desiredValue:
          type: number
          format: double
          description: Target/desired value of the progress range
          examples:
          - 20000.0
        source:
          type: string
          description: 'Origin of the update: MANUAL (UI), API (public API), or AUTO (system/linked issues)'
          enum:
          - MANUAL
          - API
          - AUTO
          examples:
          - MANUAL
    ApiExportUpdateComment:
      type: object
      description: A comment on an update
      properties:
        commentId:
          type: string
          description: Unique comment identifier
          examples:
          - 6456a3b200ee2b102e34fdba
        updateId:
          type: string
          description: ID of the update this comment belongs to
          examples:
          - 6456a3b200ee2b102e34fdb9
        text:
          type: string
          description: Comment text content
        authorAccountId:
          type: string
          description: Jira account ID of the comment author
          examples:
          - 557058:5aedf933-2312-40bc-b328-0c21314167f0
        replyToCommentId:
          type: string
          description: ID of the comment this is a reply to, if threaded
        created:
          type: string
          format: date-time
          description: When the comment was created
          examples:
          - 2024-02-15T14:30:00+0000
        lastEdited:
          type: string
          format: date-time
          description: When the comment was last edited
          examples:
          - 2024-02-15T15:00:00+0000
    ApiExportBulkUpdate:
      type: object
      description: Paginated list of updates
      properties:
        updates:
          type: array
          description: List of updates, newest first
          items:
            $ref: '#/components/schemas/ApiExportUpdate'
        nextCursor:
          type: string
          description: Cursor for fetching the next page. Null when there are no more results.
    ApiExportTeam:
      type: object
      description: A team linked to objectives or key results in this export payload
      properties:
        id:
          type: string
          description: Team identifier. Matches the corresponding **teamIds** entry on objectives and key results in this response. For additional team properties, use the **Teams** API documented in the BigPicture developer documentation.
          examples:
          - '2'
          - '7'
          - '11'
        name:
          type: string
          description: Team name
          examples:
          - Engineering
    ApiExportProgressDefinition:
      type: object
      description: Progress tracking definition for a key result
      properties:
        type:
          type: string
          description: 'Key result type: STANDARD (manual progress) or AUTO (JQL-driven)'
          enum:
          - STANDARD
          - AUTO
          examples:
          - STANDARD
        startValue:
          type: number
          format: double
          description: Start value of the progress range
          examples:
          - 0.0
        desiredValue:
          type: number
          format: double
          description: Target/desired value of the progress range
          examples:
          - 100.0
        jql:
          type: string
          description: JQL query for auto key results (null for standard key results)
    ApiExportData:
      type: object
      description: Response containing objectives and/or key results with optionally expanded related entities
      properties:
        okrs:
          type: array
          description: List of objectives
          items:
            $ref: '#/components/schemas/ApiExportObjective'
        krs:
          type: array
          description: List of key results (included when expand contains KEY_RESULTS or OBJECTIVES)
          items:
            $ref: '#/components/schemas/ApiExportKeyResult'
        teams:
          type: array
          description: Teams referenced by objectives and key results (included when **expand** contains **TEAMS**). Each **id** matches the corresponding **teamIds** entry. For more team fields, use the **Teams** API documented in the BigPicture developer documentation.
          items:
            $ref: '#/components/schemas/ApiExportTeam'
        periods:
          type: array
          description: List of periods (included when expand contains PERIODS)
          items:
            $ref: '#/components/schemas/ApiExportPeriodAlias'
        labels:
          type: array
          description: List of labels (included when expand contains LABELS)
          items:
            $ref: '#/components/schemas/ApiExportLabel'
        okrTypes:
          type: array
          description: List of OKR types (included when expand contains TYPES)
          items:
            $ref: '#/components/schemas/ApiExportOkrType'
        customFields:
          type: array
          description: List of custom field definitions (included when expand contains CUSTOM_FIELDS)
          items:
            $ref: '#/components/schemas/ApiExportCustomField'
    ApiExportObjective:
      type: object
      description: An OKR objective
      properties:
        id:
          type: string
          description: Unique identifier
          examples:
          - 62334eac00ee2b102e34fdb7
        key:
          type: string
          description: Human-readable key
          examples:
          - OBJ-42
        name:
          type: string
          description: Objective title
          examples:
          - Increase revenue by 20%
        link:
          type: string
          description: Deep link to the objective in OKR for Jira
          examples:
          - https://mysite.atlassian.net/jira/apps/ebe8335e-f3f9-49d1-a3d4-dc939aa419ac/1edb3e3f-2b65-4edd-b3fe-b5417244e1bd#box/ROOT/okr?navigationEntryPoint=modulePicker&clientRoute=L2RldGFpbHMvby82OTI1YzIzMDRiYjBmNWM3ZmI4MzYwNTd
        description:
          type: string
          description: Rich-text description
        parentObjectiveId:
          type: string
          description: ID of the parent objective, if nested
          examples:
          - 62334eac00ee2b102e34fdb6
        okrTypeId:
          type: string
          description: OKR type ID, when types are enabled
        okrTypeName:
          type: string
          description: OKR type name, when types are enabled
        ownerAccountId:
          type: string
          description: Jira account ID of the owner
          examples:
          - 557058:5aedf933-2312-40bc-b328-0c21314167f0
        collaboratorAccountIds:
          type: array
          description: Jira account IDs of collaborators
          items:
            type: string
        percentDone:
          type: number
          format: double
          description: Progress percentage (0-100)
          examples:
          - 67.5
        created:
          type: string
          format: date-time
          description: Creation timestamp
          examples:
          - 2024-01-15T10:30:00+0000
        startDate:
          type: string
          format: date-time
          description: Start date
          examples:
          - 2024-01-01T00:00:00+0000
        deadline:
          type: string
          format: date-time
          description: Due date
          examples:
          - 2024-03-31T23:59:59+0000
        expectedEndDate:
          type: string
          format: date-time
          description: Expected end date
          examples:
          - 2024-03-31T23:59:59+0000
        labelIds:
          type: array
          description: IDs of associated labels
          items:
            type: string
        teamIds:
          type: array
          description: Team identifiers linked to this objective. Match **teams[].id** when **TEAMS** is expanded. For more team fields, use the **Teams** API documented in the BigPicture developer documentation.
          items:
            type: string
        krIds:
          type: array
          description: IDs of child key results
          items:
            type: string
        childObjectiveIds:
          type: array
          description: IDs of child objectives
          items:
            type: string
        latestUpdate:
          $ref: '#/components/schemas/ApiExportUpdate'
        periodAliasId:
          type: string
          description: ID of the period this objective belongs to
        weight:
          type: integer
          format: int32
          description: Weight for weighted progress calculation
          examples:
          - 1
        finalGrade:
          type: number
          format: double
          description: Final grade when objective is closed
          examples:
          - 0.85
        iconBackgroundColor:
          type: string
          description: Icon background color hex code
          examples:
          - '#4C9AFF'
        iconTextColor:
          type: string
          description: Icon text color hex code
          examples:
          - '#FFFFFF'
        customFields:
          type: object
          additionalProperties: {}
          description: Custom field values keyed by field ID. Only includes fields that are visible (not hidden or deleted). Expand CUSTOM_FIELDS to receive field definitions (id, name, type, etc.) as a lookup.
    ApiExportLabel:
      type: object
      description: A label used to categorize OKRs
      properties:
        id:
          type: string
          description: Unique label identifier
          examples:
          - 6123abc000ee2b102e34fd02
        name:
          type: string
          description: Label name
          examples:
          - High Priority
    ApiExportBulkUpdateComments:
      type: object
      description: Paginated list of update comments
      properties:
        comments:
          type: array
          description: List of comments, newest first
          items:
            $ref: '#/components/schemas/ApiExportUpdateComment'
        nextCursor:
          type: string
          description: Cursor for fetching the next page. Null when there are no more results.
    ApiExportCustomField:
      type: object
      description: Custom field definition
      properties:
        id:
          type: string
          description: Unique identifier of the custom field
        name:
          type: string
          description: User-facing label for the field
        type:
          type: string
          description: Data type of the custom field
          enum:
          - TEXT
          - NUMBER
          - HYPERLINK
          - SELECT
          - MULTI_SELECT
          - USER
          - DATE
        applicableGoalTypes:
          type: array
          description: Goal types this field applies to
          items:
            type: string
            enum:
            - OBJECTIVE
            - KEY_RESULT
          uniqueItems: true
        description:
          type: string
          description: Description of the field's purpose
        selectOptions:
          type: array
          description: Available options for SELECT and MULTI_SELECT fields
          items:
            type: string
        multipleUsers:
          type: boolean
          description: Whether multiple users can be selected (USER type only)
        maxLength:
          type: integer
          format: int32
          description: Maximum length for TEXT fields
        displayOrder:
          type: integer
          format: int32
          description: Display order in the UI
    ApiExportUnit:
      type: object
      description: Unit of measurement for key result progress
      properties:
        name:
          type: string
          description: Unit name
          examples:
          - Currency
        symbol:
          type: string
          description: Unit symbol
          examples:
          - $
    ApiExportOkrType:
      type: object
      description: An OKR type definition
      properties:
        id:
          type: string
          description: Unique type identifier
          examples:
          - 6123abc000ee2b102e34fd04
        name:
          type: string
          description: Type name
          examples:
          - Company OKR
        backgroundColor:
          type: string
          description: Icon background color hex code
          examples:
          - '#4C9AFF'
        textColor:
          type: string
          description: Icon text color hex code
          examples:
          - '#FFFFFF'
    ApiExportPeriodAlias:
      type: object
      description: A time period for OKRs
      properties:
        id:
          type: string
          description: Unique period identifier
          examples:
          - 6123abc000ee2b102e34fd03
        name:
          type: string
          description: Period name
          examples:
          - Q1 2024
        startDate:
          type: string
          format: date-time
          description: Period start date
          examples:
          - 2024-01-01T00:00:00+0000
        deadline:
          type: string
          format: date-time
          description: Period end date
          examples:
          - 2024-03-31T23:59:59+0000
  securitySchemes:
    API-Token:
      type: apiKey
      description: API authentication token generated from OKR module settings. Send only this header name (`API-Token`), not `Authorization` or `Authentication`.
      name: API-Token
      in: header
