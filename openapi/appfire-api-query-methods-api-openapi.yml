          type: integer
          format: int64
        example: 1748647410000
      - name: expand
        in: query
        description: Related data to expand. OBJECTIVES, TEAMS, PERIODS, LABELS, TYPES, CUSTOM_FIELDS.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - OBJECTIVES
            - TEAMS
            - PERIODS
            - LABELS
            - TYPES
            - CUSTOM_FIELDS
      responses:
        '200':
          description: Successful retrieval of key results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiExportData'
        '400':
          description: Invalid expand options provided
          content:
            application/json:
              schema:
                type: object
        '401':
