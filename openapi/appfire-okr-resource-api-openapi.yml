components:
  schemas:
    MilestoneOutputBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        expectedDate:
          type: string
          format: date-time
        targetValue:
          type: number
          format: double
        actualValue:
          type:
          - number
          - 'null'
          format: double
        gapDifference:
          type: number
          format: double
        gapPercent:
          type: integer
          format: int32
        actualOverallPercent:
          type: integer
          format: int32
        expectedOverallPercent:
          type: integer
          format: int32
        entityType:
          type: string
          enum:
          - OBJECTIVE
          - KEY_RESULT
        okrId:
          type: string
        status:
          type: string
          enum:
          - ACHIEVED
          - UPCOMING
          - MISSED
          - INVALID
        invalidReason:
          type: string
          enum:
          - DATE_OUT_OF_RANGE
          - UNIT_MISMATCH
      required:
      - actualOverallPercent
      - entityType
      - expectedDate
      - expectedOverallPercent
      - gapDifference
      - gapPercent
      - id
      - name
      - okrId
      - status
      - targetValue
    PredefinedPeriod:
      type: object
      properties:
        type:
          type: string
          enum:
          - QUARTER
          - YEAR
        quarter:
          type: integer
          format: int32
        year:
          type: integer
          format: int32
      required:
      - type
      - year
    UpdateBean:
      type: object
      properties:
        id:
          type: string
        entityId:
          type: string
        status:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        isComplete:
          type: boolean
          writeOnly: true
        value:
          type:
          - number
          - 'null'
          format: double
        createdISODate:
          type: string
        editedISODate:
          type:
          - string
          - 'null'
        updatedBy:
          $ref: '#/components/schemas/JiraUser'
        source:
          type: string
          enum:
          - MANUAL
          - API
          - AUTO
        isAutomaticUpdate:
          type: boolean
        description:
          type: string
        numericProgressBean:
          $ref: '#/components/schemas/NumericProgressBean'
        unit:
          $ref: '#/components/schemas/KeyResultUpdateUnit'
        pinISODate:
          type:
          - string
          - 'null'
        updateEvent:
          type:
          - string
          - 'null'
          enum:
          - CONVERTED_TO_AUTOMATIC_PROGRESS_TRACKING
          - CONVERTED_TO_MANUAL_PROGRESS_TRACKING
        changes:
          $ref: '#/components/schemas/UpdateTransitionBean'
        complete:
          type: boolean
      required:
      - createdISODate
      - entityId
      - id
      - source
      - status
      - updatedBy
    NumericProgressBean:
      type: 'null'
      properties:
        startValue:
          type: number
          format: double
        desiredValue:
          type: number
          format: double
        currentValue:
          type: number
          format: double
      required:
      - currentValue
      - desiredValue
      - startValue
    ProgressGraphDtoValueAggregateBean:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: '#/components/schemas/ValueAggregateBean'
        unit:
          $ref: '#/components/schemas/KeyResultUpdateUnit'
      required:
      - end
      - points
      - start
    OkrGoalOutputBean:
      type: object
