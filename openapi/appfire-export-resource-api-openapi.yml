openapi: 3.2.0
info:
  title: OpenAPI definition Export Resource API
  version: v0
servers:
- url: http://okr-ppm-prod.appfire.com
  description: Generated server url
tags:
- name: export-resource
paths:
  /api/v2/export:
    get:
      tags:
      - export-resource
      operationId: export
      parameters:
      - name: startDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: endDate
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportData'
      summary: Export
      x-summary-source: derived
components:
