    ExportLabel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ExportData:
      type: object
      properties:
        version:
          type: string
        okrs:
          type: array
          items:
            $ref: '#/components/schemas/ExportObjective'
        krs:
          type: array
          items:
            $ref: '#/components/schemas/ExportKeyResult'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/ExportUpdate'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/ExportTeam'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/ExportPeriodAlias'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/ExportLabel'
    ExportObjective:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        parentObjectiveId:
          type: string
        ownerAccountId:
          type: string
        collaboratorAccountIds:
          type: array
          items:
            type: string
        percentDone:
          type: number
          format: double
        created:
          type: string
          format: date-time
        startDate:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        labelIds:
          type: array
          items:
            type: string
        teamIds:
          type: array
