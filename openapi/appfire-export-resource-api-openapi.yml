        id:
          type: string
        name:
          type: string
    ExportUpdate:
      type: object
      properties:
        entityId:
          type: string
        status:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
