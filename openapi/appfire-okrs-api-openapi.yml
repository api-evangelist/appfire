          format: date-time
        linkedIssueIds:
          type: array
          items:
            type: string
        linkedEntities:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEntity'
        autoLinkedIssueIds:
          type: array
          items:
            type: string
        manuallyLinkedIssueIds:
          type: array
          items:
            type: string
        finalGrading:
          type: number
          format: double
        completionDate:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/InternalTeamBean'
        periodId:
          type: string
        expectedStartDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        periodAlias:
          $ref: '#/components/schemas/PeriodAlias'
        unit:
          $ref: '#/components/schemas/KeyResultUpdateUnit'
        copiedFrom:
          type: string
        weight:
          type: integer
          format: int32
        objectiveType:
          $ref: '#/components/schemas/ObjectiveType'
        restrictedEntityLevel:
          type: string
          enum:
          - OPEN
          - EDIT_RESTRICTED
          - VIEW_EDIT_RESTRICTED
        userAccessLevel:
          type: string
          enum:
          - VIEW
          - EDIT
        restrictingEntityId:
          type: string
        rank:
          type: string
        manualJqlFilter:
          type: string
        boxFilterData:
          $ref: '#/components/schemas/BoxFilterData'
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/OkrCustomFieldOutputBean'
        displayOrder:
          type: integer
          format: int32
        latestPastMilestone:
          $ref: '#/components/schemas/MilestoneOutputBean'
      required:
      - autoLinkedIssueIds
      - collaboratorAccountIds
      - collaborators
      - created
      - dateOfLastChange
      - expectedEndDate
      - expectedStartDate
      - id
      - key
      - labels
      - linkedIssueIds
      - manuallyLinkedIssueIds
      - name
      - owner
      - parentObjectiveId
      - percentDone
      - state
      - teams
      - type
      - updates
      - weight
    Label:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
        textColor:
          type: string
      required:
      - backgroundColor
      - name
      - textColor
    KeyResultOutputBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        type:
          type: string
          enum:
          - STANDARD
          - AUTO
        description:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CLOSED
          - DELETED
        creator:
          $ref: '#/components/schemas/JiraUser'
        owner:
          $ref: '#/components/schemas/JiraUser'
        collaboratorAccountIds:
          type: array
          items:
            type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserOrTeam'
        created:
          type: string
          format: date-time
        parentObjectiveId:
          type: string
        percentDone:
          type: number
          format: double
        numericProgress:
          $ref: '#/components/schemas/NumericProgressDefinitionBean'
        jql:
          type: string
