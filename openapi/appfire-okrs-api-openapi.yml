openapi: 3.2.0
info:
  title: OpenAPI definition OKRs API
  version: v0
  description: Retrieve and update OKR objectives and key results. Used by BigPicture for cross-product OKR synchronization.
servers:
- url: http://okr-ppm-prod.appfire.com
  description: Generated server url
tags:
- name: OKRs
  description: Retrieve and update OKR objectives and key results. Used by BigPicture for cross-product OKR synchronization.
paths:
  /api/internal/objective/{goalId}:
    put:
      tags:
      - OKRs
      summary: Update objective (PUT compatibility)
      description: Kept for legacy BigPicture code. Use PATCH instead — both behave identically on the server side, but PATCH has the correct HTTP semantics for partial updates.
      operationId: updateObjectiveViaPut
      parameters:
      - name: goalId
        in: path
        description: Objective ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OkrUpdateInputBean'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
      deprecated: true
    patch:
      tags:
      - OKRs
      summary: Update objective
      description: Partially updates an objective's title, owner, start date, or end date. At least one field must be provided.
      operationId: updateObjective
      parameters:
      - name: goalId
        in: path
        description: Objective ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OkrUpdateInputBean'
        required: true
      responses:
        '200':
          description: Updated objective returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
        '400':
          description: Empty payload or invalid dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
        '404':
          description: Objective not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
  /api/internal/kr/{krId}:
    put:
      tags:
      - OKRs
      summary: Update key result (PUT compatibility)
      description: Kept for legacy BigPicture code. Use PATCH instead — both behave identically on the server side, but PATCH has the correct HTTP semantics for partial updates.
      operationId: updateKeyResultViaPut
      parameters:
      - name: krId
        in: path
        description: Key result ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OkrUpdateInputBean'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
      deprecated: true
    patch:
      tags:
      - OKRs
      summary: Update key result
      description: Partially updates a key result's title, owner, start date, or end date. At least one field must be provided.
      operationId: updateKeyResult
      parameters:
      - name: krId
        in: path
        description: Key result ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OkrUpdateInputBean'
        required: true
      responses:
        '200':
          description: Updated key result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
        '400':
          description: Empty payload or invalid dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
        '404':
          description: Key result not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOkrOutputBean'
  /api/internal/okrs:
    get:
      tags:
      - OKRs
      summary: Get all OKRs
      description: Retrieves all objectives and key results for a tenant identified by Forge installation ID. Uses the same objective and key result payload shape as POST /api/filtered-okrs (see OKRChangeOutputBean), with objectives and key results typed as OkrGoalInternalOutputBean / KeyResultInternalOutputBean so visible custom fields are returned as the customFields array (id, name, type, value); definitions come from the same visibility rules as export. M2M callers have no Jira user context, so every loaded objective and key result is included in okrs and krs. Each entry in the teams array on objectives and key results includes id; resolve name and iconColors via the Teams API documented in the BigPicture developer documentation.
      operationId: getAllOkrs
      parameters:
      - name: X-APPFIRE-M2M-AUTH-INSTALLATION-ID
        in: header
        description: Forge installation ID of the tenant
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OKRChangeInternalOutputBean'
        '400':
          description: Missing required Header X-APPFIRE-M2M-AUTH-INSTALLATION-ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OKRChangeInternalOutputBean'
        '401':
          description: Invalid or missing M2M Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OKRChangeInternalOutputBean'
        '404':
          description: Host not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OKRChangeInternalOutputBean'
components:
  schemas:
    MilestoneOutputBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        expectedDate:
          type: string
          format: date-time
        targetValue:
          type: number
          format: double
        actualValue:
          type:
          - number
          - 'null'
          format: double
        gapDifference:
          type: number
          format: double
        gapPercent:
          type: integer
          format: int32
        actualOverallPercent:
          type: integer
          format: int32
        expectedOverallPercent:
          type: integer
          format: int32
        entityType:
          type: string
          enum:
          - OBJECTIVE
          - KEY_RESULT
        okrId:
          type: string
        status:
          type: string
          enum:
          - ACHIEVED
          - UPCOMING
          - MISSED
          - INVALID
        invalidReason:
          type: string
          enum:
          - DATE_OUT_OF_RANGE
          - UNIT_MISMATCH
      required:
      - actualOverallPercent
      - entityType
      - expectedDate
      - expectedOverallPercent
      - gapDifference
      - gapPercent
      - id
      - name
      - okrId
      - status
      - targetValue
    OkrUpdateInputBean:
      type: object
      description: Partial update payload for objectives and key results
      properties:
        title:
          type: string
          description: New title for the OKR
          examples:
          - Increase Q1 revenue by 20%
        ownerAccountId:
          type: string
          description: Jira account ID of the new owner
          examples:
          - 557058:5aedf933-2312-40bc-b328-0c21314167f0
        startDate:
          type: string
          format: date-time
          description: New start date
        expectedEndDate:
          type: string
          format: date-time
          description: New expected end date
    UpdateBean:
      type: object
      properties:
        id:
          type: string
        entityId:
          type: string
        status:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        isComplete:
          type: boolean
          writeOnly: true
        value:
          type:
          - number
          - 'null'
          format: double
        createdISODate:
          type: string
        editedISODate:
          type:
          - string
          - 'null'
        updatedBy:
          $ref: '#/components/schemas/JiraUser'
        source:
          type: string
          enum:
          - MANUAL
          - API
          - AUTO
        isAutomaticUpdate:
          type: boolean
        description:
          type: string
        numericProgressBean:
          $ref: '#/components/schemas/NumericProgressBean'
        unit:
          $ref: '#/components/schemas/KeyResultUpdateUnit'
        pinISODate:
          type:
          - string
          - 'null'
        updateEvent:
          type:
          - string
          - 'null'
          enum:
          - CONVERTED_TO_AUTOMATIC_PROGRESS_TRACKING
          - CONVERTED_TO_MANUAL_PROGRESS_TRACKING
        changes:
          $ref: '#/components/schemas/UpdateTransitionBean'
        complete:
          type: boolean
      required:
      - createdISODate
      - entityId
      - id
      - source
      - status
      - updatedBy
    NumericProgressBean:
      type: 'null'
      properties:
        startValue:
          type: number
          format: double
        desiredValue:
          type: number
          format: double
        currentValue:
          type: number
          format: double
      required:
      - currentValue
      - desiredValue
      - startValue
    OkrGoalOutputBean:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        summary:
          type: string
        description:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CLOSED
          - DELETED
        creator:
          $ref: '#/components/schemas/JiraUser'
        owner:
          $ref: '#/components/schemas/JiraUser'
        collaboratorAccountIds:
          type: array
          items:
            type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserOrTeam'
        periodId:
          type: string
        expectedStartDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        completionDate:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
        keyResultGradings:
          type: object
          additionalProperties:
            type: number
            format: double
        parentGoalId:
          type: string
        percentDone:
          type: number
          format: double
        periodAlias:
          $ref: '#/components/schemas/PeriodAlias'
        keyResultIds:
          type: array
          items:
            type: string
        childObjectiveIds:
          type: array
          items:
            type: string
        latestStatusUpdate:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        latestStatusUpdateDescription:
          type: string
        latestStatusUpdateValue:
          type: number
          format: double
        dateOfLastChange:
          type: string
          format: date-time
        finalGrading:
          type: number
          format: double
        weight:
          type: integer
          format: int32
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/SimpleTeamBean'
        progressType:
          type: string
          enum:
          - BY_CHILDREN
          - MANUAL
        objectiveType:
          $ref: '#/components/schemas/ObjectiveType'
        copiedFrom:
          type: string
        restrictedEntityLevel:
          type: string
          enum:
          - OPEN
          - EDIT_RESTRICTED
          - VIEW_EDIT_RESTRICTED
        userAccessLevel:
          type: string
          enum:
          - VIEW
          - EDIT
        restrictingEntityId:
          type: string
        rank:
          type: string
        displayOrder:
          type: integer
          format: int32
        customFieldValues:
          type: object
          additionalProperties: {}
        latestPastMilestone:
          $ref: '#/components/schemas/MilestoneOutputBean'
      required:
      - childObjectiveIds
      - collaboratorAccountIds
      - collaborators
      - created
      - dateOfLastChange
      - expectedEndDate
      - expectedStartDate
      - id
      - key
      - keyResultIds
      - labels
      - latestStatusUpdate
      - percentDone
      - progressType
      - state
      - summary
      - teams
      - weight
    ObjectiveType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        iconColors:
          $ref: '#/components/schemas/ObjectiveTypeIconColors'
        canOnlyBeAssignedDuringCreation:
          type: boolean
        customPrefix:
          type: object
          additionalProperties:
            type: string
        appProvided:
          type: boolean
        hidden:
          type: boolean
      required:
      - name
    KeyResultUpdateUnit:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - NUMERIC
          - PERCENT
          - CURRENCY
        isSymbolBefore:
          type: boolean
          writeOnly: true
        symbolBefore:
          type: boolean
      required:
      - name
      - symbol
      - type
    UpdatesBean:
      type: object
      properties:
        maxResults:
          type: integer
          format: int64
        values:
          type: array
          items:
            $ref: '#/components/schemas/UpdateBean'
      required:
      - maxResults
      - values
    OkrGoalInternalOutputBean:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        summary:
          type: string
        description:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CLOSED
          - DELETED
        creator:
          $ref: '#/components/schemas/JiraUser'
        owner:
          $ref: '#/components/schemas/JiraUser'
        collaboratorAccountIds:
          type: array
          items:
            type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserOrTeam'
        periodId:
          type: string
        expectedStartDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        completionDate:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
        keyResultGradings:
          type: object
          additionalProperties:
            type: number
            format: double
        parentGoalId:
          type: string
        percentDone:
          type: number
          format: double
        periodAlias:
          $ref: '#/components/schemas/PeriodAlias'
        keyResultIds:
          type: array
          items:
            type: string
        childObjectiveIds:
          type: array
          items:
            type: string
        latestStatusUpdate:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        latestStatusUpdateDescription:
          type: string
        latestStatusUpdateValue:
          type: number
          format: double
        dateOfLastChange:
          type: string
          format: date-time
        finalGrading:
          type: number
          format: double
        weight:
          type: integer
          format: int32
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/InternalTeamBean'
        progressType:
          type: string
          enum:
          - BY_CHILDREN
          - MANUAL
        objectiveType:
          $ref: '#/components/schemas/ObjectiveType'
        copiedFrom:
          type: string
        restrictedEntityLevel:
          type: string
          enum:
          - OPEN
          - EDIT_RESTRICTED
          - VIEW_EDIT_RESTRICTED
        userAccessLevel:
          type: string
          enum:
          - VIEW
          - EDIT
        restrictingEntityId:
          type: string
        rank:
          type: string
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/OkrCustomFieldOutputBean'
        displayOrder:
          type: integer
          format: int32
        latestPastMilestone:
          $ref: '#/components/schemas/MilestoneOutputBean'
      required:
      - childObjectiveIds
      - collaboratorAccountIds
      - collaborators
      - created
      - dateOfLastChange
      - expectedEndDate
      - expectedStartDate
      - id
      - key
      - keyResultIds
      - labels
      - latestStatusUpdate
      - percentDone
      - progressType
      - state
      - summary
      - teams
      - weight
    InternalTeamBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        iconColors:
          $ref: '#/components/schemas/IconColors'
      required:
      - id
    IconColors:
      type: object
      properties:
        backgroundColor:
          type: string
          minLength: 1
        textColor:
          type: string
          minLength: 1
      required:
      - backgroundColor
      - textColor
    OkrCustomFieldOutputBean:
      type: object
      description: Custom field value with id, name, type, and value
      properties:
        id:
          type: string
          description: Custom field definition id
          example: cf_123
        name:
          type: string
          description: Field display name
        type:
          type: string
          description: Field type (lowercase enum name, e.g. text, number, select)
          example: text
        value:
          description: Stored value; shape depends on field type
    JiraUser:
      type: object
      properties:
        id:
          type: string
        userName:
          type: string
        accountId:
          type: string
      required:
      - accountId
    ProgressEntity:
      type: object
      properties:
        id:
          type: string
        externalEntityId:
          type: string
        type:
          type: string
          enum:
          - JIRA_ISSUE
          - JQL
          - BP_BOX
        tenantId:
          type: string
        progress:
          type: number
          format: double
        weight:
          type: integer
          format: int32
      required:
      - externalEntityId
      - progress
      - type
      - weight
    UserOrTeam:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
          - USER
          - TEAM
      required:
      - type
    BoxFilterData:
      type: object
      properties:
        parentBoxesIds:
          type: array
          items:
            type: string
        boxTypesIds:
          type: array
          items:
            type: string
        boxStatusesIds:
          type: array
          items:
            type: string
        inputSearch:
          type: string
    RestrictedAutoKrEntityOutputBean:
      allOf:
      - $ref: '#/components/schemas/RestrictedEntityOutputBean'
      - type: object
        properties:
          id:
            type: string
      required:
      - id
      - percentDone
      - weight
    NumericProgressDefinitionBean:
      type: object
      properties:
        startValue:
          type: number
          format: double
        targetValue:
          type: number
          format: double
      required:
      - startValue
      - targetValue
    SingleOkrOutputBean:
      type: object
      properties:
        type:
          type: string
          enum:
          - OKR
          - KR
          - RESTRICTED
        objective:
          $ref: '#/components/schemas/OkrGoalOutputBean'
        kr:
          $ref: '#/components/schemas/KeyResultOutputBean'
        restrictedEntity:
          oneOf:
          - $ref: '#/components/schemas/RestrictedAutoKrEntityOutputBean'
          - $ref: '#/components/schemas/RestrictedKrEntityOutputBean'
          - $ref: '#/components/schemas/RestrictedOkrEntityOutputBean'
      required:
      - type
    SimpleTeamBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        iconColors:
          $ref: '#/components/schemas/IconColors'
      required:
      - iconColors
      - id
      - name
    KeyResultInternalOutputBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        type:
          type: string
          enum:
          - STANDARD
          - AUTO
        description:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CLOSED
          - DELETED
        creator:
          $ref: '#/components/schemas/JiraUser'
        owner:
          $ref: '#/components/schemas/JiraUser'
        collaboratorAccountIds:
          type: array
          items:
            type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserOrTeam'
        created:
          type: string
          format: date-time
        parentObjectiveId:
          type: string
        percentDone:
          type: number
          format: double
        numericProgress:
          $ref: '#/components/schemas/NumericProgressDefinitionBean'
        jql:
          type: string
        updates:
          $ref: '#/components/schemas/UpdatesBean'
        latestValue:
          $ref: '#/components/schemas/LatestValueBean'
        latestStatusUpdate:
