        name:
          type: string
        description:
          type: string
        expectedDate:
          type: string
          format: date-time
        targetValue:
          type: number
          format: double
        actualValue:
          type:
          - number
          - 'null'
          format: double
        gapDifference:
          type: number
          format: double
        gapPercent:
          type: integer
          format: int32
        actualOverallPercent:
          type: integer
          format: int32
        expectedOverallPercent:
          type: integer
          format: int32
        entityType:
          type: string
          enum:
          - OBJECTIVE
          - KEY_RESULT
        okrId:
          type: string
        status:
          type: string
