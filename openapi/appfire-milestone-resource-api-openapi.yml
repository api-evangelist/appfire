        description:
          type: string
        expectedDate:
          type: string
          format: date-time
        targetValue:
          type: number
          format: double
        entityType:
          type: string
          enum:
          - OBJECTIVE
          - KEY_RESULT
        okrId:
          type: string
      required:
      - entityType
      - expectedDate
      - name
      - okrId
      - targetValue
