openapi: 3.0.0
info:
  title: 7pace REST API
  description: API to fetch worklogs and account settings.
  version: 2.0.0

servers:
  - url: /
    description: Production API

paths:
  /api/v2/worklogs:
    get:
      summary: Get a list of worklogs
      description: Returns a paginated list of worklogs with filters.
      parameters:
        - name: before
          in: query
          schema:
            type: string
          description: Cursor for pagination. Returns results before the specified cursor.
        - name: after
          in: query
          schema:
            type: string
          description: Cursor for pagination. Returns results after the specified cursor.
        - name: externalItemId
          in: query
          schema:
            type: array
            items:
              type: string
          description: Accepts a single string or array.
        - name: assigneeId
          in: query
          schema:
            type: array
            items:
              type: string
          description: Accepts a single string or array.
        - name: authorId
          in: query
          schema:
            type: array
            items:
              type: string
          description: Accepts a single string or array.
        - name: startedAt.start
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that logged time starting after the specified date.
        - name: startedAt.end
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that logged time starting before the specified date.
        - name: editedAt.start
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were updated after the specified date.
        - name: editedAt.end
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were updated before the specified date.
        - name: createdAt.start
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were created after the specified date.
        - name: createdAt.end
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were created before the specified date.
      responses:
        "200":
          description: A list of worklogs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/Worklog"
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                      prev:
                        type: object
                        properties:
                          href:
                            type: string
                      next:
                        type: object
                        properties:
                          href:
                            type: string
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
        "400":
          description: Error response for invalid filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
    post:
      summary: Create a worklog
      description: Creates a worklog.
      requestBody:
        description: Worklog object to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorklogRequest"
      responses:
        "200":
          description: Worklog created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogResponse"
        "400":
          description: Worklog cannot be created, invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user does not have permission to create a worklog for the provided assigneeId.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "404":
          description: The referenced worklog or assignee was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/worklogs/{worklogId}:
    put:
      summary: Update a worklog
      description: Updates a worklog by its Id.
      parameters:
        - name: worklogId
          in: path
          required: true
          schema:
            type: string
          description: The Id of the worklog to update.
      requestBody:
        description: Worklog object to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorklogRequest"
      responses:
        "200":
          description: Worklog updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogResponse"
        "400":
          description: Worklog cannot be updated - passed worklog ID or request body is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to update this worklog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "404":
          description: Worklog not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

    delete:
      summary: Delete a worklog
      description: Deletes a worklog by its ID.
      parameters:
        - name: worklogId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the worklog to delete.
      responses:
        "204":
          description: Worklog deleted successfully.
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The submitting user does not have permission to delete this worklog.
        "404":
          description: Worklog not found.

  /api/v2/worklogs/views/incrementalChanges:
    get:
      summary: Get a list of all worklogs, including deleted worklogs.
      description: To get a change list, use parameters editedAt.start and editedAt.end to return a list of all changes during the specified timeframe. All other filters can be used in combination. Use returned worklog field isDeleted to identify deleted worklogs.
      parameters:
        - name: before
          in: query
          schema:
            type: string
          description: Cursor for pagination. Returns results before the specified cursor.
        - name: after
          in: query
          schema:
            type: string
          description: Cursor for pagination. Returns results after the specified cursor.
        - name: externalItemId
          in: query
          schema:
            type: array
            items:
              type: string
          description: Accepts a single string or array.
        - name: assigneeId
          in: query
          schema:
            type: array
            items:
              type: string
          description: Accepts a single string or array.
        - name: authorId
          in: query
          schema:
            type: array
            items:
              type: string
          description: Accepts a single string or array.
        - name: startedAt.start
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that logged time starting after the specified date.
        - name: startedAt.end
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that logged time starting before the specified date.
        - name: editedAt.start
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were updated after the specified date.
        - name: editedAt.end
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were updated before the specified date.
        - name: createdAt.start
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were created after the specified date.
        - name: createdAt.end
          in: query
          schema:
            type: string
            format: date-time
          description: Filters worklogs that were created before the specified date.
      responses:
        "200":
          description: A list of worklogs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChangedWorklog"
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                      prev:
                        type: object
                        properties:
                          href:
                            type: string
                      next:
                        type: object
                        properties:
                          href:
                            type: string
                  pageInfo:
                    $ref: "#/components/schemas/PageInfo"
        "400":
          description: Error response for invalid filters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string

  /api/v2/worklogs/migrated:
    post:
      summary: Create a migrated worklog
      description: Creates a migrated worklog. Requires ADMIN permission (Manage 7pace settings and assign roles to users). Migrated worklogs bypass tracking-details, locked-date, and closed-item validations, and are not synchronized to Jira.
      requestBody:
        description: Worklog object to create as migrated
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorklogRequest"
      responses:
        "200":
          description: Migrated worklog created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorklogResponse"
        "400":
          description: Worklog cannot be created, invalid request body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user does not have permission to create migrated worklogs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "404":
          description: The referenced worklog or assignee was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/worklogs/migrated/{worklogId}:
    delete:
      summary: Delete a migrated worklog
      description: Deletes a migrated worklog by its ID. Requires ADMIN permission (Manage 7pace settings and assign roles to users).
      parameters:
        - name: worklogId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the migrated worklog to delete.
      responses:
        "204":
          description: Migrated worklog deleted successfully.
        "400":
          description: The worklog is not migrated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user does not have permission to delete migrated worklogs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "404":
          description: Worklog not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/settings/accountSettings/jiraNotifications:
    get:
      summary: Returns Jira notifications settings.
      description: |
        Returns Jira notifications settings.

        Notifications are sent in Jira due to 7pace Timetracker exporting worklogs to Jira-native time tracking. Notifications are sent for the following operations: create, update, or delete worklog.
      responses:
        "200":
          description: Jira notifications setting returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraNotificationsSettingsResponse"
    put:
      summary: Enables or disables Jira notifications
      description: |
        Enables or disables Jira notifications. It may take a couple of minutes for a configuration change to fully take effect.

        Notifications are sent in Jira due to 7pace Timetracker exporting worklogs to Jira-native time tracking. Notifications are sent for the following operations: create, update, or delete worklog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JiraNotificationsSettingsRequest"
      responses:
        "200":
          description: Jira notifications setting updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraNotificationsSettingsResponse"

  /api/v2/settings/customFields:
    get:
      summary: Get account settings
      description: Returns the global custom fields plus per-space settings for the current account.
      responses:
        "200":
          description: Account settings data
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    properties:
                      customFields:
                        $ref: "#/components/schemas/AccountSettings"
                      settings:
                        type: array
                        items:
                          $ref: "#/components/schemas/CustomFieldSetting"
  /api/v2/settings/customFields/dropdown:
    post:
      summary: Create a dropdown custom field
      description: Creates a dropdown custom field definition in the specified setting if settingId is provided, or in the global scope otherwise.
      parameters:
        - in: query
          name: settingId
          required: false
          description: Setting id to scope the custom field to. Omit for global.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDropdownCustomFieldRequest"
      responses:
        "200":
          description: Custom field definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropdownSettings"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to create this custom field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/settings/customFields/dropdown/{customFieldId}:
    put:
      summary: Update a dropdown custom field
      description: Updates a dropdown custom field definition in the specified setting if settingId is provided, or in the global scope otherwise.
      parameters:
        - in: path
          name: customFieldId
          required: true
          schema:
            type: string
        - in: query
          name: settingId
          required: false
          description: Setting id the custom field belongs to. Omit for global.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDropdownCustomFieldRequest"
      responses:
        "200":
          description: Custom field definition updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropdownSettings"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to update this custom field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "404":
          description: Custom field not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/settings/customFields/toggle:
    post:
      summary: Create a toggle custom field
      description: Creates a toggle custom field definition in the specified setting if settingId is provided, or in the global scope otherwise.
      parameters:
        - in: query
          name: settingId
          required: false
          description: Setting id to scope the custom field to. Omit for global.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateToggleCustomFieldRequest"
      responses:
        "200":
          description: Custom field definition created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleSettings"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to create this custom field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/settings/customFields/toggle/{customFieldId}:
    put:
      summary: Update a toggle custom field
      description: Updates a toggle custom field definition in the specified setting if settingId is provided, or in the global scope otherwise.
      parameters:
        - in: path
          name: customFieldId
          required: true
          schema:
            type: string
        - in: query
          name: settingId
          required: false
          description: Setting id the custom field belongs to. Omit for global.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToggleCustomFieldRequest"
      responses:
        "200":
          description: Custom field definition updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToggleSettings"
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to update this custom field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "404":
          description: Custom field not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
        "500":
          description: Internal server error.

  /api/v2/settings/customFields/{customFieldId}:
    delete:
      summary: Delete a custom field
      description: Deletes a custom field definition by id in the specified setting if settingId is provided, or in the global scope otherwise.
      parameters:
        - in: path
          name: customFieldId
          required: true
          schema:
            type: string
        - in: query
          name: settingId
          required: false
          description: Setting id the custom field belongs to. Omit for global.
          schema:
            type: string
      responses:
        "204":
          description: Custom field deleted successfully, or it did not exist prior to the request.
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "500":
          description: Internal server error.

  /api/v2/settings/customFields/settings:
    post:
      summary: Create a custom fields setting
      description: Creates a custom fields setting bound to one or more spaces (Jira project ids).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomFieldSettingRequest"
      responses:
        "200":
          description: Setting created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldSetting"
        "400":
          description: Validation error. CUSTOM_FIELDS_SETTING_CONFLICT is returned when the name is already in use or a space is already bound to another setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to manage settings.
        "500":
          description: Internal server error.

  /api/v2/settings/customFields/settings/{settingId}:
    put:
      summary: Update a custom fields setting
      description: Updates a setting name and/or its bound spaces. At least one of name or spaceIds must be provided.
      parameters:
        - in: path
          name: settingId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomFieldSettingRequest"
      responses:
        "200":
          description: Setting updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFieldSetting"
        "400":
          description: Validation error. CUSTOM_FIELDS_SETTING_NOT_FOUND when the setting does not exist; CUSTOM_FIELDS_SETTING_CONFLICT on name or space uniqueness violations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to manage settings.
        "500":
          description: Internal server error.
    delete:
      summary: Delete a custom fields setting
      description: Deletes a custom fields setting by id. Idempotent.
      parameters:
        - in: path
          name: settingId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Setting deleted successfully, or it did not exist prior to the request.
        "401":
          description: Unauthorized access. This indicates a problem with Authorization. Ensure apitoken is valid, and you are setting Authorization header to Bearer {apitoken}
        "403":
          description: Forbidden. The user associated with the apitoken does not have permission to manage settings.
        "500":
          description: Internal server error.

security:
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer

  schemas:
    PageInfo:
      type: object
      properties:
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
        startCursor:
          type: string
        endCursor:
          type: string

    Worklog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        comment:
          type: string
        startedAt:
          type: string
          format: date-time
          example: "2025-07-15T09:30:11"
        createdAt:
