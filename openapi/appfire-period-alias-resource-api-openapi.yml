openapi: 3.2.0
info:
  title: OpenAPI definition Period Alias Resource API
  version: v0
servers:
- url: http://okr-ppm-prod.appfire.com
  description: Generated server url
tags:
- name: period-alias-resource
paths:
  /api/v2/periodAlias:
    get:
      tags:
      - period-alias-resource
      operationId: getAvailableAliases
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodAlias'
      summary: Get available aliases
      x-summary-source: derived
    post:
      tags:
      - period-alias-resource
      operationId: createAlias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodAliasInputBean'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      summary: Create alias
      x-summary-source: derived
  /api/v2/periodAlias/{aliasId}:
    post:
      tags:
      - period-alias-resource
      operationId: editCustomAlias_1
      parameters:
      - name: aliasId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodAliasInputBean'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      summary: Edit custom alias 1
      x-summary-source: derived
    delete:
      tags:
      - period-alias-resource
      operationId: deleteAlias
      parameters:
      - name: aliasId
        in: path
        required: true
        schema:
          type: string
      - name: replacementPeriodId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      summary: Delete alias
      x-summary-source: derived
  /api/v2/periodAlias/{aliasId}/updateVisibility:
    post:
      tags:
      - period-alias-resource
      operationId: changeVisibilityOfProvidedAlias
      parameters:
      - name: aliasId
        in: path
        required: true
        schema:
          type: string
      - name: visible
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      summary: Change visibility of provided alias
      x-summary-source: derived
  /api/v2/periodAlias/{periodId}/usage:
    get:
      tags:
      - period-alias-resource
      operationId: getPeriodUsage
      parameters:
      - name: periodId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      summary: Get period usage
      x-summary-source: derived
  /api/v2/periodAlias/all:
    get:
      tags:
      - period-alias-resource
      operationId: getAllAliases
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodAlias'
      summary: Get all aliases
      x-summary-source: derived
components:
  schemas:
    PeriodAliasInputBean:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
      required:
      - name
    PeriodAlias:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        appProvided:
          type: boolean
        hidden:
          type: boolean
      required:
      - deadline
      - name
      - startDate
