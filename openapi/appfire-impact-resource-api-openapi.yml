      - symbol
      - type
    UpdatesBean:
      type: object
      properties:
        maxResults:
          type: integer
          format: int64
        values:
          type: array
          items:
            $ref: '#/components/schemas/UpdateBean'
      required:
      - maxResults
      - values
    IconColors:
      type: object
      properties:
        backgroundColor:
          type: string
          minLength: 1
        textColor:
          type: string
          minLength: 1
      required:
      - backgroundColor
      - textColor
    JiraUser:
      type: object
      properties:
        id:
          type: string
        userName:
          type: string
        accountId:
