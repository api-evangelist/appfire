openapi: 3.2.0
info:
  title: OpenAPI definition Impact Resource API
  version: v0
servers:
- url: http://okr-ppm-prod.appfire.com
  description: Generated server url
tags:
- name: impact-resource
paths:
  /api/v2/impact/{parentObjectiveId}/bulk-set-children:
    post:
      tags:
      - impact-resource
      operationId: bulkSetWeightForChildren
      parameters:
      - name: parentObjectiveId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBulkWeightRequestBean'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OKRChangeOutputBean'
      summary: Bulk set weight for children
      x-summary-source: derived
  /api/v2/impact/new/{parentObjectiveId}:
    get:
      tags:
      - impact-resource
      operationId: getImpactForNew
      parameters:
      - name: parentObjectiveId
        in: path
        required: true
        schema:
          type: string
      - name: weight
        in: query
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: number
                format: double
      summary: Get impact for new
      x-summary-source: derived
  /api/v2/impact/existing/{parentObjectiveId}/{type}/{id}:
    get:
      tags:
      - impact-resource
      operationId: getImpactForExisting
      parameters:
      - name: parentObjectiveId
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: number
                format: double
      summary: Get impact for existing
      x-summary-source: derived
components:
  schemas:
    MilestoneOutputBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        expectedDate:
          type: string
          format: date-time
        targetValue:
          type: number
          format: double
        actualValue:
          type:
          - number
          - 'null'
          format: double
        gapDifference:
          type: number
          format: double
        gapPercent:
          type: integer
          format: int32
        actualOverallPercent:
          type: integer
          format: int32
        expectedOverallPercent:
          type: integer
          format: int32
        entityType:
          type: string
          enum:
          - OBJECTIVE
          - KEY_RESULT
        okrId:
          type: string
        status:
          type: string
          enum:
          - ACHIEVED
          - UPCOMING
          - MISSED
          - INVALID
        invalidReason:
          type: string
          enum:
          - DATE_OUT_OF_RANGE
          - UNIT_MISMATCH
      required:
      - actualOverallPercent
      - entityType
      - expectedDate
      - expectedOverallPercent
      - gapDifference
      - gapPercent
      - id
      - name
      - okrId
      - status
      - targetValue
    UpdateBean:
      type: object
      properties:
        id:
          type: string
        entityId:
          type: string
        status:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        isComplete:
          type: boolean
          writeOnly: true
        value:
          type:
          - number
          - 'null'
          format: double
        createdISODate:
          type: string
        editedISODate:
          type:
          - string
          - 'null'
        updatedBy:
          $ref: '#/components/schemas/JiraUser'
        source:
          type: string
          enum:
          - MANUAL
          - API
          - AUTO
        isAutomaticUpdate:
          type: boolean
        description:
          type: string
        numericProgressBean:
          $ref: '#/components/schemas/NumericProgressBean'
        unit:
          $ref: '#/components/schemas/KeyResultUpdateUnit'
        pinISODate:
          type:
          - string
          - 'null'
        updateEvent:
          type:
          - string
          - 'null'
          enum:
          - CONVERTED_TO_AUTOMATIC_PROGRESS_TRACKING
          - CONVERTED_TO_MANUAL_PROGRESS_TRACKING
        changes:
          $ref: '#/components/schemas/UpdateTransitionBean'
        complete:
          type: boolean
      required:
      - createdISODate
      - entityId
      - id
      - source
      - status
      - updatedBy
    NumericProgressBean:
      type: 'null'
      properties:
        startValue:
          type: number
          format: double
        desiredValue:
          type: number
          format: double
        currentValue:
          type: number
          format: double
      required:
      - currentValue
      - desiredValue
      - startValue
    OkrGoalOutputBean:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        summary:
          type: string
        description:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CLOSED
          - DELETED
        creator:
          $ref: '#/components/schemas/JiraUser'
        owner:
          $ref: '#/components/schemas/JiraUser'
        collaboratorAccountIds:
          type: array
          items:
            type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserOrTeam'
        periodId:
          type: string
        expectedStartDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        completionDate:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
        keyResultGradings:
          type: object
          additionalProperties:
            type: number
            format: double
        parentGoalId:
          type: string
        percentDone:
          type: number
          format: double
        periodAlias:
          $ref: '#/components/schemas/PeriodAlias'
        keyResultIds:
          type: array
          items:
            type: string
        childObjectiveIds:
          type: array
          items:
            type: string
        latestStatusUpdate:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        latestStatusUpdateDescription:
          type: string
        latestStatusUpdateValue:
          type: number
          format: double
        dateOfLastChange:
          type: string
          format: date-time
        finalGrading:
          type: number
          format: double
        weight:
          type: integer
          format: int32
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/SimpleTeamBean'
        progressType:
          type: string
          enum:
          - BY_CHILDREN
          - MANUAL
        objectiveType:
          $ref: '#/components/schemas/ObjectiveType'
        copiedFrom:
          type: string
        restrictedEntityLevel:
          type: string
          enum:
          - OPEN
          - EDIT_RESTRICTED
          - VIEW_EDIT_RESTRICTED
        userAccessLevel:
          type: string
          enum:
          - VIEW
          - EDIT
        restrictingEntityId:
          type: string
        rank:
          type: string
        displayOrder:
          type: integer
          format: int32
        customFieldValues:
          type: object
          additionalProperties: {}
        latestPastMilestone:
          $ref: '#/components/schemas/MilestoneOutputBean'
      required:
      - childObjectiveIds
      - collaboratorAccountIds
      - collaborators
      - created
      - dateOfLastChange
      - expectedEndDate
      - expectedStartDate
      - id
      - key
      - keyResultIds
      - labels
      - latestStatusUpdate
      - percentDone
      - progressType
      - state
      - summary
      - teams
      - weight
    ObjectiveType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        iconColors:
          $ref: '#/components/schemas/ObjectiveTypeIconColors'
        canOnlyBeAssignedDuringCreation:
          type: boolean
        customPrefix:
          type: object
          additionalProperties:
            type: string
        appProvided:
          type: boolean
        hidden:
          type: boolean
      required:
      - name
    KeyResultUpdateUnit:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - NUMERIC
          - PERCENT
          - CURRENCY
