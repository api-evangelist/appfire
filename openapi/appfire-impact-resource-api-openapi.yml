      type: object
      discriminator:
        propertyName: type
      properties:
        type:
          type: string
          enum:
          - OKR
          - KR
          - AUTO_KR
        parentObjectiveId:
          type: string
        childObjectiveIds:
          type: array
          items:
            type: string
        keyResultIds:
          type: array
          items:
            type: string
        percentDone:
          type: number
          format: double
        weight:
          type: integer
          format: int32
        rank:
          type: string
        displayOrder:
          type: integer
          format: int32
      required:
      - percentDone
      - type
      - weight
