      - percentDone
      - weight
    NumericProgressDefinitionBean:
      type: object
      properties:
        startValue:
          type: number
          format: double
        targetValue:
          type: number
          format: double
      required:
      - startValue
      - targetValue
    BoxFilterData:
      type: object
      properties:
        parentBoxesIds:
          type: array
          items:
            type: string
        boxTypesIds:
          type: array
          items:
            type: string
        boxStatusesIds:
          type: array
          items:
            type: string
        inputSearch:
          type: string
    UpdateBulkWeightRequestBean:
      type: object
      properties:
        krWeights:
          type: object
          additionalProperties:
            type: integer
            format: int32
        objectiveWeights:
          type: object
          additionalProperties:
            type: integer
            format: int32
      required:
      - krWeights
      - objectiveWeights
    Label:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        backgroundColor:
          type: string
        textColor:
          type: string
      required:
      - backgroundColor
      - name
      - textColor
    KeyResultOutputBean:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        type:
          type: string
          enum:
          - STANDARD
          - AUTO
        description:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - CLOSED
          - DELETED
        creator:
          $ref: '#/components/schemas/JiraUser'
        owner:
          $ref: '#/components/schemas/JiraUser'
        collaboratorAccountIds:
          type: array
          items:
            type: string
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/UserOrTeam'
        created:
          type: string
          format: date-time
        parentObjectiveId:
          type: string
        percentDone:
          type: number
          format: double
        numericProgress:
          $ref: '#/components/schemas/NumericProgressDefinitionBean'
        jql:
          type: string
        updates:
          $ref: '#/components/schemas/UpdatesBean'
        latestValue:
          $ref: '#/components/schemas/LatestValueBean'
        latestStatusUpdate:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        dateOfLastChange:
          type: string
          format: date-time
        autoLinkedIssueIds:
          type: array
          items:
            type: string
        linkedEntities:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEntity'
        manuallyLinkedIssueIds:
          type: array
          items:
            type: string
        finalGrading:
          type: number
          format: double
        completionDate:
          type: string
          format: date-time
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        teams:
          type: array
          items:
            $ref: '#/components/schemas/SimpleTeamBean'
        periodId:
          type: string
        expectedStartDate:
          type: string
          format: date-time
        expectedEndDate:
          type: string
          format: date-time
        periodAlias:
          $ref: '#/components/schemas/PeriodAlias'
        unit:
          $ref: '#/components/schemas/KeyResultUpdateUnit'
        copiedFrom:
          type: string
        weight:
          type: integer
          format: int32
        objectiveType:
          $ref: '#/components/schemas/ObjectiveType'
        restrictedEntityLevel:
          type: string
          enum:
          - OPEN
          - EDIT_RESTRICTED
          - VIEW_EDIT_RESTRICTED
        userAccessLevel:
          type: string
          enum:
          - VIEW
          - EDIT
        restrictingEntityId:
          type: string
        rank:
          type: string
        displayOrder:
          type: integer
          format: int32
        manualJqlFilter:
          type: string
        boxFilterData:
          $ref: '#/components/schemas/BoxFilterData'
        customFieldValues:
          type: object
          additionalProperties: {}
        latestPastMilestone:
          $ref: '#/components/schemas/MilestoneOutputBean'
      required:
      - autoLinkedIssueIds
      - collaboratorAccountIds
      - collaborators
      - created
      - dateOfLastChange
      - expectedEndDate
      - expectedStartDate
      - id
      - key
      - labels
      - manuallyLinkedIssueIds
      - name
      - owner
      - parentObjectiveId
      - percentDone
      - state
      - teams
      - type
      - updates
      - weight
    OKRChangeOutputBean:
      type: object
      properties:
        okrs:
          type: array
          items:
            $ref: '#/components/schemas/OkrGoalOutputBean'
        krs:
          type: array
          items:
            $ref: '#/components/schemas/KeyResultOutputBean'
        restrictedEntities:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/RestrictedAutoKrEntityOutputBean'
            - $ref: '#/components/schemas/RestrictedKrEntityOutputBean'
            - $ref: '#/components/schemas/RestrictedOkrEntityOutputBean'
      required:
      - krs
      - okrs
      - restrictedEntities
    RestrictedKrEntityOutputBean:
      allOf:
      - $ref: '#/components/schemas/RestrictedEntityOutputBean'
