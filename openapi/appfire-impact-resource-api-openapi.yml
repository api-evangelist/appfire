          type: number
          format: double
        numericProgress:
          $ref: '#/components/schemas/NumericProgressDefinitionBean'
      required:
      - numericProgress
      - value
    UpdateTransitionBean:
      type: 'null'
      properties:
        statusChanged:
          type: boolean
        progressChanged:
          type: boolean
        previousStatus:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
        currentStatus:
          type: string
          enum:
          - ON_TRACK
          - AT_RISK
          - ACTION_REQUIRED
          - NOT_STARTED
          - SUCCESS
          - FINISHED
          - ASSUMPTIONS_CHANGED
          - DELAYED
          - CANCELED
          - FAILED
          - UNDEFINED
          - MISSED_TARGET
