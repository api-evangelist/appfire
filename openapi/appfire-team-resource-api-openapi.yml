components:
  schemas:
    TeamCreateInputBean:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        fetchType:
          type: string
          enum:
          - MANUAL
          - JIRA_SYNC
        memberAccountIdsWithRole:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdWithUserRole'
        groupIdsWithRole:
          type: array
          items:
            $ref: '#/components/schemas/GroupIdWithUserRole'
        iconColors:
          $ref: '#/components/schemas/IconColors'
      required:
      - fetchType
      - groupIdsWithRole
      - iconColors
      - memberAccountIdsWithRole
      - name
    UserWithRole:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/JiraUser'
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - USER
      required:
      - role
      - user
    JiraUser:
      type: object
      properties:
        id:
          type: string
        userName:
          type: string
        accountId:
          type: string
      required:
      - accountId
    AccountIdWithUserRole:
      type: object
      properties:
        accountId:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - USER
      required:
      - accountId
      - role
    GroupIdWithUserRole:
      type: object
      properties:
        groupId:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - MANAGER
          - USER
      required:
      - groupId
      - role
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        creator:
          $ref: '#/components/schemas/JiraUser'
        userFetchType:
          type: string
          enum:
          - MANUAL
          - JIRA_SYNC
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserWithRole'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupIdWithRole'
        resolvedUserAccountIds:
          type: array
          items:
            $ref: '#/components/schemas/UserWithRole'
        jiraSyncRunning:
          type: boolean
        dateOfLastSuccessfulSync:
          type: string
          format: date-time
        iconColors:
          $ref: '#/components/schemas/IconColors'
      required:
      - creator
      - groups
      - iconColors
      - jiraSyncRunning
      - members
      - name
      - resolvedUserAccountIds
      - userFetchType
    IconColors:
      type: object
      properties:
        backgroundColor:
          type: string
          minLength: 1
        textColor:
          type: string
          minLength: 1
      required:
      - backgroundColor
      - textColor
    TeamUpdateInputBean:
      type: object
      properties:
        name:
          type: string
        fetchType:
          type: string
          enum:
          - MANUAL
          - JIRA_SYNC
        memberAccountIdsWithRole:
          type: array
          items:
            $ref: '#/components/schemas/AccountIdWithUserRole'
        groupIdsWithRole:
          type: array
          items:
            $ref: '#/components/schemas/GroupIdWithUserRole'
        iconColors:
          $ref: '#/components/schemas/IconColors'
    GroupIdWithRole:
      type: object
      properties:
        groupId:
          type: string
          minLength: 1
        role:
