x-notes:
  appfire_com_bot_wall: >-
    appfire.com returns HTTP 429 to every automated request (curl and WebFetch alike), so the marketing
    and legal pages could not be probed directly. The PrivacyPolicy, TermsOfService and Blog URLs above
    are the published paths surfaced by search with their live page titles; every other pointer in this
    file was fetched and its status recorded. All API, docs and status hosts responded normally.
  internal_spec_not_harvested: >-
    okr-ppm-prod.appfire.com also serves an unauthenticated default springdoc document at /v3/api-docs
    (222 paths / 277 operations) that includes internal, migration, mail-test and queue-consumer
    endpoints. Only the curated public document at /v3/api-docs/public was harvested. The unrestricted
    internal one looks like an unintended exposure and is worth reporting to Appfire.

