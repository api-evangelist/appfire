    Public REST API for BigPicture, BigGantt and BigTemplate on Atlassian Cloud (Appfire's portfolio and
    project-management suite). Exposes boxes, box types, tasks, teams, team memberships, resources, skills,
    absences, scope definitions and task assignments. Authenticated with a bearer API token issued from
    the BigPicture UI. The reference is published on a hosted developer portal; the underlying OpenAPI
    documents are rendered there but are not offered as an anonymous download.
