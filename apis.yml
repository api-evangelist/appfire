aid: appfire
name: Appfire
description: >-
  Appfire is a global software company that builds, acquires, and operates a large portfolio of apps
  that enhance, extend, and connect the platforms enterprise teams already run on — principally
  Atlassian Jira, Confluence and Jira Service Management (Cloud and Data Center), plus Microsoft Azure
  DevOps, monday.com and Salesforce. Its product families cover portfolio and project management
  (BigPicture, BigGantt, BigTemplate), goal setting (OKR for Jira), time tracking (7pace Timetracker
  for Jira and for Azure DevOps), document workflow and approvals (Comala Document Management),
  workflow automation and scripting (Jira Misc Workflow Extensions, Power Scripts), and administration
  tooling (the Appfire/Atlassian Command Line Interface). Public, machine-readable API surface is
  per-product rather than company-wide: 7pace Timetracker for Jira publishes OpenAPI 3.0 for its v1
  and v2 REST APIs, the OKR app serves an OpenAPI 3.1 document for its public export/update API, and
  BigPicture publishes a hosted API reference for its Cloud and Data Center REST APIs.
