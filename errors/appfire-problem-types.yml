gaps:
- No application/problem+json anywhere; adopting RFC 9457 would give every product one machine-readable error shape.
- 7pace ships a ProblemDetails schema that no response references — wiring it up is a one-line change per response.
- OKR types all error bodies as an empty object, so a generated client gets no error model at all.
- No stable error codes/identifiers a client can branch on, except the two 7pace CUSTOM_FIELDS_SETTING_* strings.
