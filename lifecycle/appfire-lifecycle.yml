versioning:
  scheme: uri-path
  detail: >-
    Versioning is per product, in the URI path. 7pace Timetracker for Jira runs v1 and v2 concurrently,
    each with its own OpenAPI document and a Swagger UI version selector. The Appfire OKR public API is
    at /api/v2. BigPicture Cloud is at /public/{product}/rest and additionally reports
    currentVersion/latestVersion in every response envelope so clients can detect a newer version.
  current:
    7pace-timetracker-for-jira: v2 (v1 still served)
    appfire-okr: v2
    bigpicture-cloud: 1 (envelope currentVersion)
