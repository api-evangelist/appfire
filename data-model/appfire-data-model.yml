id_conventions:
- api: Appfire OKR
  detail: >-
    Objectives and key results carry both an opaque `id` and a human `key`. People are Jira Cloud
    accountIds, not OKR-local users — joining to a person requires the Jira API.
- api: 7pace Timetracker
  detail: >-
    Worklogs reference the Jira work item through `externalItemId`, making Jira the system of record
    for what was worked on. Paging is cursor-based via PageInfo.startCursor/endCursor.
- api: BigPicture Cloud
  detail: 'Box ids are prefixed strings, e.g. ROOT and PROG-3045.'
