summary: >-
  Two independent entity graphs, one per public API — there is no shared Appfire data model. The OKR
  graph is a goal hierarchy (objectives contain key results, both carry check-in updates) anchored to
  Jira accountIds and issue ids. The 7pace graph is a single fact table (worklog) plus account-level
  custom-field configuration. BigPicture's entities are named on its developer portal (boxes, box
  types, tasks, teams, resources, skills, absences, scope definitions) but its schemas are not
  anonymously downloadable, so its relationships are listed as documented-only, not derived.
